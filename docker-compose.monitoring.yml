# Подключается вместе с docker-compose.yml и docker-compose.prod.yml.
services:
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=15GB
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    mem_limit: 1536m

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_PUBLIC_HOST:-77.91.114.154}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_BRUTE_FORCE_LOGIN_PROTECTION: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_BIND_IP:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - grafana_admin_password
    restart: unless-stopped
    mem_limit: 768m

  grafana-proxy:
    image: caddy:2.11.7-alpine
    environment:
      GRAFANA_PUBLIC_HOST: ${GRAFANA_PUBLIC_HOST:-77.91.114.154}
    ports:
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./monitoring/Caddyfile:/etc/caddy/Caddyfile:ro
      - grafana_proxy_data:/data
      - grafana_proxy_config:/config
    depends_on:
      - grafana
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped
    mem_limit: 128m

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command: [--path.rootfs=/host, --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)]
    volumes:
      - /:/host:ro,rslave
    pid: host
    restart: unless-stopped
    mem_limit: 128m

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    command: [--docker_only=true, --housekeeping_interval=30s, --store_container_labels=false]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped
    mem_limit: 256m

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: ${MONITORING_DATABASE_URL:?Set a read-only monitoring database URL}
    restart: unless-stopped
    mem_limit: 128m

  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.12.1
    environment:
      PGBOUNCER_EXPORTER_CONNECTION_STRING: ${MONITORING_PGBOUNCER_URL:?Set PgBouncer statistics connection URL}
    restart: unless-stopped
    mem_limit: 64m

  redis-exporter:
    image: oliver006/redis_exporter:v1.96.0
    environment:
      REDIS_ADDR: ${MONITORING_REDIS_URL:-redis://redis:6379/0}
    restart: unless-stopped
    mem_limit: 64m

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped
    mem_limit: 64m

  pgbouncer:
    environment:
      STATS_USERS: ${PGBOUNCER_STATS_USERS:-researcher}

  library:
    environment:
      REDIS_URL: ${MONITORING_REDIS_URL:-redis://redis:6379/0}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-}

  minio:
    environment:
      # Метрики доступны в закрытой Docker-сети; порты MinIO не публикуются.
      MINIO_PROMETHEUS_AUTH_TYPE: public

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  grafana_proxy_data:
  grafana_proxy_config:

secrets:
  grafana_admin_password:
    file: ${MONITORING_SECRETS_DIR:-./.monitoring-secrets}/grafana_admin_password
