services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: researcher
      POSTGRES_PASSWORD: researcher
      POSTGRES_DB: researcher
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researcher -d researcher"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://researcher:researcher@postgres:5432/researcher
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/migrations/migrate.sh"]
    restart: "no"

  translator:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      TRANSLATION_HTTP_ADDR: ":8090"
    entrypoint: ["translator"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  parser:
    build:
      context: ./services/parser
    env_file:
      - .env
    environment:
      PARSER_HTTP_ADDR: "0.0.0.0:8091"
      PARSER_ENGINE: ${PARSER_ENGINE:-pymupdf}
      PARSER_OCR: ${PARSER_OCR:-auto}
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  websearch:
    build:
      context: ./services/websearch
    env_file:
      - .env
    environment:
      WEBSEARCH_LLM_BASE_URL: ${WEBSEARCH_LLM_BASE_URL:-https://api.aitunnel.ru/v1}
      WEBSEARCH_LLM_API_KEY: ${WEBSEARCH_LLM_API_KEY:-}
      WEBSEARCH_LLM_MODEL: ${WEBSEARCH_LLM_MODEL:?WEBSEARCH_LLM_MODEL must be set in .env}
      WEBSEARCH_TIMEOUT_SECONDS: ${WEBSEARCH_TIMEOUT_SECONDS:-180}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    ports:
      - "8092:8092"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8092/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8101"
      DATABASE_URL: postgres://researcher:researcher@postgres:5432/researcher
    entrypoint: ["identity"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8101/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8102"
      DATABASE_URL: postgres://researcher:researcher@postgres:5432/researcher
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9002
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: papers
    entrypoint: ["catalog"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8102/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  library:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8103"
      DATABASE_URL: postgres://researcher:researcher@postgres:5432/researcher
    entrypoint: ["library"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8103/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  annotations:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8104"
      DATABASE_URL: postgres://researcher:researcher@postgres:5432/researcher
      CATALOG_URL: http://catalog:8102
    entrypoint: ["annotations"]
    depends_on:
      catalog:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8104/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  assistant:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8105"
      DATABASE_URL: postgres://researcher:researcher@postgres:5432/researcher
      CATALOG_URL: http://catalog:8102
      TRANSLATION_SERVICE_URL: http://translator:8090
    entrypoint: ["assistant"]
    depends_on:
      catalog:
        condition: service_healthy
      translator:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8105/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  feed:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8106"
      REDIS_URL: redis://redis:6379/0
    entrypoint: ["feed"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8106/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  searchapi:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8107"
      DATABASE_URL: postgres://researcher:researcher@postgres:5432/researcher
      WEBSEARCH_SERVICE_URL: http://websearch:8092
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    entrypoint: ["searchapi"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      websearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8107/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ./backend
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8000"
      IDENTITY_URL: http://identity:8101
      CATALOG_URL: http://catalog:8102
      LIBRARY_URL: http://library:8103
      ANNOTATIONS_URL: http://annotations:8104
      ASSISTANT_URL: http://assistant:8105
      FEED_URL: http://feed:8106
      SEARCH_API_URL: http://searchapi:8107
    entrypoint: ["gateway"]
    depends_on:
      identity:
        condition: service_healthy
      catalog:
        condition: service_healthy
      library:
        condition: service_healthy
      annotations:
        condition: service_healthy
      assistant:
        condition: service_healthy
      feed:
        condition: service_healthy
      searchapi:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://researcher:researcher@postgres:5432/researcher
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9002
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: papers
      PARSER_SERVICE_URL: http://parser:8091
      PARSER_OCR: ${PARSER_OCR:-auto}
      PARSER_TIMEOUT_SECONDS: ${PARSER_TIMEOUT_SECONDS:-180}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      parser:
        condition: service_healthy
    entrypoint: ["worker"]

volumes:
  postgres_data:
  minio_data:
