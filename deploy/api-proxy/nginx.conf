# Финский сервер: доступ к этому порту идёт через SSH-туннель.
server {
    listen 127.0.0.1:18080;
    server_name _;
    server_tokens off;

    access_log off;
    error_log /var/log/nginx/api-proxy-error.log warn;
    client_max_body_size 32m;

    resolver 1.1.1.1 9.9.9.9 valid=60s ipv6=off;
    resolver_timeout 10s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $api_host;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_redirect off;
    proxy_next_upstream off;

    proxy_connect_timeout 20s;
    proxy_send_timeout 60s;
    proxy_read_timeout 2100s;
    send_timeout 2100s;

    proxy_ssl_server_name on;
    proxy_ssl_name $api_host;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    gzip off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /openai/v1/ {
        limit_except GET POST {
            deny all;
        }

        set $api_host api.openai.com;
        rewrite ^/openai(/v1/.*)$ $1 break;
        proxy_pass https://$api_host$uri$is_args$args;
    }

    location /openrouter/api/v1/ {
        limit_except GET POST {
            deny all;
        }

        set $api_host openrouter.ai;
        rewrite ^/openrouter(/api/v1/.*)$ $1 break;
        proxy_pass https://$api_host$uri$is_args$args;
    }

    location / {
        return 404;
    }
}
