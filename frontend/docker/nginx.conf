# Старые HTTP-ссылки переводим на HTTPS. Запросы Caddy уже имеют
# X-Forwarded-Proto: https; внутренние проверки по имени frontend не редиректим.
map "$http_x_forwarded_proto:$host" $odyssey_redirect_https {
    default 0;
    ":77.91.114.154" 1;
    "http:77.91.114.154" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    if ($odyssey_redirect_https) {
        return 308 https://77.91.114.154$request_uri;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Scripts only from our own bundle, no eval: the reader renders PDFs from
    # any URL a chat link names (pdf.js font-program exploits run through eval).
    # add_header in a location drops server-level headers, so both locations set it.
    set $csp "script-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'";

    # Hashed assets are immutable; index.html must always be re-fetched.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/ /index.html;
    }
}
